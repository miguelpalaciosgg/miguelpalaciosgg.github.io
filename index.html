<style>
/* Consola de trabajo a pantalla completa: barra de estado, terminal a la izquierda y visor con pestañas a la derecha. */
:root{
  --bg:#07090c; --bg1:#0b0e13; --bg2:#10141b; --line:#1b222c; --line2:#2a333f;
  --text:#c9d1d9; --hi:#eef2f6; --muted:#8b949e;
  --green:#3fb950; --cyan:#39c5cf; --amber:#d29922; --red:#ff7b72;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 'JetBrains Mono',ui-monospace,'Cascadia Code',Consolas,monospace;
  display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:var(--cyan);text-decoration:underline;text-decoration-color:rgba(57,197,207,.4);text-underline-offset:2px}
a:hover{text-decoration-color:var(--cyan)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:1px solid var(--cyan);outline-offset:2px}
::selection{background:rgba(63,185,80,.28)}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---- barra de estado ---- */
.status{flex:0 0 auto;display:flex;align-items:center;gap:18px;height:32px;padding:0 12px;border-bottom:1px solid var(--line);
  background:var(--bg1);font-size:12px;white-space:nowrap;color:var(--muted)}
.status .home{color:var(--hi);font-weight:700}
.status .home b{color:var(--green);font-weight:700}
.status .dot{color:var(--green)}
.status .val{color:var(--text)}
.status .sp{flex:1}
.langsw{display:flex;border:1px solid var(--line2)}
.langsw button{padding:1px 8px;color:var(--muted);font-size:12px}
.langsw button[aria-pressed="true"]{background:var(--line2);color:var(--hi)}
.langsw button:hover{color:var(--hi)}

/* ---- cambio de panel en móvil ---- */
.mswitch{display:none}

/* ---- paneles ---- */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.term{border-right:1px solid var(--line)}
.phead{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:28px;padding:0 12px;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--muted);background:var(--bg1)}
.phead .idx{color:var(--muted)}
.pane:focus-within .phead .idx{color:var(--green)}
.phead .name{color:var(--text)}

/* terminal */
.out{flex:1 1 auto;min-height:0;overflow-y:auto;padding:12px 14px 4px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.blk{margin:0 0 12px;overflow-wrap:anywhere}
.echo{margin:0 0 4px;color:var(--hi);overflow-wrap:anywhere}
.ps1{color:var(--green);font-weight:600}
.ps1 i{color:var(--cyan);font-style:normal}
.mut{color:var(--muted)}
.hi{color:var(--hi)}
.ok{color:var(--green)}
.k{color:var(--cyan)}
.warn{color:var(--amber)}
.err{color:var(--red)}
.h{color:var(--hi);font-weight:700}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:1px 18px}
.tbl{display:grid;grid-template-columns:max-content max-content minmax(0,1fr);gap:2px 16px}
.xp{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:0 18px;margin-bottom:10px}
.xp ul,.blk ul{list-style:none}
.xp li,.blk li.b{padding-left:1.6ch;text-indent:-1.6ch;color:var(--text)}
.xp li::before,.blk li.b::before{content:'- ';color:var(--muted)}
pre.art{font:inherit;color:var(--muted);line-height:1.25}
.lnk{color:var(--cyan);text-decoration:underline;text-decoration-color:rgba(57,197,207,.4);text-underline-offset:2px;padding:0;text-align:left}
.lnk:hover{text-decoration-color:var(--cyan)}
.prompt{flex:0 0 auto;display:flex;align-items:center;gap:1ch;padding:6px 14px 8px;border-top:1px solid transparent}
.prompt label{white-space:nowrap}
.prompt input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:var(--hi);font:inherit;caret-color:var(--green);padding:2px 0}
.prompt:focus-within{border-top-color:var(--line)}
.chips{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px 10px;border-top:1px solid var(--line);background:var(--bg1)}
.chips button{border:1px solid var(--line2);padding:2px 9px;font-size:12px;color:var(--text);border-radius:2px}
.chips button:hover{border-color:var(--green);color:var(--hi)}
.chips button::before{content:'$ ';color:var(--muted)}

/* visor */
.tabs{flex:0 0 auto;display:flex;align-items:stretch;height:28px;border-bottom:1px solid var(--line);background:var(--bg1);overflow-x:auto;scrollbar-width:none;font-size:12px}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;border-right:1px solid var(--line);white-space:nowrap}
.tab [role=tab]{padding:0 10px;height:100%;color:var(--muted)}
.tab [role=tab][aria-selected=true]{color:var(--hi);background:var(--bg)}
.tab [role=tab][aria-selected=true] .n{color:var(--green)}
.tab .x{padding:0 8px 0 2px;height:100%;color:var(--muted)}
.tab .x:hover{color:var(--red)}
.view{flex:1 1 auto;min-height:0;position:relative}
.vp{position:absolute;inset:0;display:flex;flex-direction:column;min-height:0}
.wbar{flex:0 0 auto;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-bottom:1px solid var(--line);font-size:12px}
.wbar .t{color:var(--hi);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40%}
.wbar .u{flex:1;min-width:0;border:1px solid var(--line);padding:2px 8px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar .btn{border:1px solid var(--line2);padding:2px 8px;color:var(--text);white-space:nowrap;text-decoration:none;border-radius:2px}
.wbar .btn:hover{border-color:var(--cyan);color:var(--hi)}
.wbar .back{display:none}
.frame{flex:1 1 auto;min-height:0;position:relative;background:var(--bg)}
.frame .ld{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}
.scroll{flex:1 1 auto;min-height:0;overflow-y:auto;padding:18px 20px 24px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}

/* dashboard */
.dash{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px 24px;max-width:980px}
.box{border:1px solid var(--line);min-width:0}
.box>h2{font-size:12px;font-weight:400;color:var(--muted);padding:4px 10px;border-bottom:1px solid var(--line);background:var(--bg1)}
.box>h2 b{color:var(--hi);font-weight:600}
.box .in{padding:10px 12px}
.wide{grid-column:1/-1}
.nf .who{color:var(--green);font-weight:700}
.nf .who i{color:var(--cyan);font-style:normal}
.nf .rule{color:var(--muted)}
.proc{width:100%;border-collapse:collapse;font-size:13px}
.proc th{text-align:left;font-weight:400;color:var(--bg);background:var(--green);padding:1px 10px}
.proc td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.proc tr:last-child td{border-bottom:0}
.proc .st{white-space:nowrap}
.proc td.sk{color:var(--muted)}
.tagl{display:flex;flex-wrap:wrap;gap:6px}
.tagl span{border:1px solid var(--line2);padding:0 7px;font-size:12px;color:var(--text)}
.links{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:3px 16px}
.hint{color:var(--muted);font-size:12px;margin-top:14px}

/* ficha sin demo */
.card{max-width:760px}
.card h2{font-size:18px;color:var(--hi);margin-bottom:4px}
.card .st{font-size:12px;margin-bottom:16px}
.card p{margin-bottom:14px}
.card ul{list-style:none;margin-bottom:16px}
.card li{padding-left:1.6ch;text-indent:-1.6ch;margin-bottom:4px}
.card li::before{content:'- ';color:var(--muted)}

@media (max-width:1100px){.dash{grid-template-columns:minmax(0,1fr)}.proc .sk{display:none}}
@media (max-width:760px){
  body{font-size:13px}
  .status{gap:12px;padding:0 10px}
  .status .upt,.status .pr,.status .clk{display:none}
  .mswitch{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line);background:var(--bg1)}
  .mswitch button{height:34px;color:var(--muted);font-size:13px}
  .mswitch button[aria-pressed=true]{color:var(--hi);box-shadow:inset 0 -2px 0 var(--green)}
  .main{grid-template-columns:minmax(0,1fr)}
  .term{border-right:0}
  body[data-view=term] .viewer,body[data-view=view] .term{display:none}
  .phead{display:none}
  .out{padding:10px 12px 4px}
  .prompt{padding:6px 12px 8px}
  .prompt input{font-size:16px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:8px 10px}
  .chips::-webkit-scrollbar{display:none}
  .chips button{white-space:nowrap;padding:5px 10px}
  .wbar .back{display:inline-block}
  .wbar .t{flex:1;max-width:none}
  .wbar .u,.wbar [data-reload],.wbar .lng{display:none}
  .tbl .hd{display:none}
  .scroll{padding:14px 12px 20px}
  .tbl{grid-template-columns:max-content minmax(0,1fr)}
  .tbl .c3{grid-column:1/-1;margin:-2px 0 6px}
  .xp{grid-template-columns:minmax(0,1fr)}
  .xp .when{color:var(--muted)}
}
/* ---- portada legible (modo por defecto) ---- */
body[data-mode=home]{--bg:#0f2620;--bg1:#15322a;--line:#24483e;--line2:#33594d;--text:#dbe7e1;--hi:#f5f8f6;--muted:#a3b8af;--green:#d9c48f;--cyan:#d9c48f}
body:not([data-mode=home]) .landing{display:none}
body[data-mode=home] .main,body[data-mode=home] .mswitch,body[data-mode=home] .clk,body[data-mode=home] .upt,body[data-mode=home] .pr{display:none}
.modebtn{border:1px solid var(--line2);padding:1px 9px;font-size:12px;color:var(--text)}
.modebtn:hover{border-color:var(--green);color:var(--hi)}
.landing{flex:1 1 auto;min-height:0;overflow-y:auto;font:17px/1.6 Inter,'Segoe UI',system-ui,sans-serif;color:#d7dee6;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.wrap{max-width:880px;margin:0 auto;padding:64px 24px 72px}
.mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.eyebrow{font-size:14px;color:var(--green);margin-bottom:14px}
.eyebrow i{color:var(--cyan);font-style:normal}
.cursor{display:inline-block;width:.6em;height:1em;margin-left:4px;background:var(--green);vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.landing h1{font-size:clamp(33px,5.6vw,50px);line-height:1.08;letter-spacing:-.02em;color:var(--hi);font-weight:700;margin-bottom:18px}
.lead{font-size:clamp(19px,2.6vw,23px);line-height:1.45;color:var(--hi);max-width:34em;margin-bottom:12px}
.sub{color:var(--muted);max-width:40em;margin-bottom:28px}
.cta{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 20px;border:1px solid var(--line2);border-radius:12px;background:rgba(255,255,255,.035);color:var(--hi);font:600 15px/1 Inter,'Segoe UI',system-ui,sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s ease,border-color .15s ease,background .15s ease,box-shadow .15s ease,color .15s ease}
.bt:hover{border-color:var(--green);background:rgba(217,196,143,.1);transform:translateY(-1px)}
.bt.pri{background:linear-gradient(180deg,#e8dab0,#d3bb7f);border-color:transparent;color:#12231d;font-weight:700;box-shadow:0 8px 22px rgba(217,196,143,.2)}
.bt.pri:hover{background:linear-gradient(180deg,#f1e6c6,#dcc68e);border-color:transparent;box-shadow:0 10px 26px rgba(217,196,143,.3)}
.bt.ic{width:48px;padding:0}
.bt.ic:hover{color:var(--green)}
.i{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.i.lleno{fill:currentColor;stroke:none}
.bt .flecha{transition:transform .15s ease}
.bt:hover .flecha{transform:translateX(3px)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:48px 0 0}
.stat{border-left:2px solid var(--green);padding:2px 0 2px 14px}
.stat b{display:block;font:700 20px/1.25'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--hi)}
.stat span{font-size:15px;color:var(--muted);line-height:1.35;display:block}
.landing h2{font:600 15px/1.3 'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--green);margin:64px 0 18px}
.landing h2::before{content:'# ';color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pc{display:flex;flex-direction:column;background:var(--bg1);border:1px solid var(--line);border-radius:8px;padding:20px}
.pc:hover{border-color:var(--line2)}
.pc .badge{font:12px/1.4 'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--muted);margin-bottom:8px}
.pc .badge.on{color:var(--green)}
.pc h3{font-size:19px;line-height:1.3;color:var(--hi);font-weight:600;margin-bottom:8px}
.pc p{font-size:16px;margin-bottom:14px;flex:1}
.pc .bt{align-self:flex-start;min-height:40px;padding:0 14px;font-size:14px}
.pc details{margin-top:12px;font-size:14px;color:var(--muted)}
.pc summary{cursor:pointer;padding:4px 0}
.pc summary:hover{color:var(--text)}
.pc .tagl{margin-top:8px}
.pc .tagl span{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
.also{margin-top:16px;color:var(--muted);font-size:16px}
.path{list-style:none}
.path li{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 18px;padding:16px 0;border-top:1px solid var(--line)}
.path li:last-child{border-bottom:1px solid var(--line)}
.path .when{font:13px/1.7 'JetBrains Mono',ui-monospace,Consolas,monospace;color:var(--muted)}
.path b{color:var(--hi);font-weight:600}
.path em{font-style:normal;color:var(--green)}
.path p{font-size:16px;margin-top:2px}
.end{margin-top:64px;padding:28px;background:var(--bg1);border:1px solid var(--line);border-radius:8px}
.end h2{margin:0 0 8px;font:700 26px/1.2 Inter,'Segoe UI',system-ui,sans-serif;color:var(--hi)}
.end h2::before{content:none}
.end p{margin-bottom:18px}
.tech{margin-top:22px;font-size:15px;color:var(--muted)}
.tech button{font:inherit;color:var(--cyan);text-decoration:underline;text-underline-offset:2px;min-height:32px}
@media (max-width:760px){
  .wrap{padding:36px 18px 48px}
  .cta .bt.pri{flex:1 1 100%}
  .cta .bt.mail{flex:1 1 0}
  .stats,.grid{grid-template-columns:minmax(0,1fr)}
  .stats{gap:16px;margin-top:36px}
  .landing h2{margin-top:48px}
  .path li{grid-template-columns:minmax(0,1fr)}
  .end{margin-top:48px;padding:22px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.cursor{animation:none}}
</style>
</head>

/* ================= salida con efecto de escritura ================= */
const out = $('#out'), input = $('#cmd');
const typing = new Set();
const CPS = 1100; // caracteres por segundo (por tiempo, para que no se atasque si el navegador frena los temporizadores)
const scroll = () => { out.scrollTop = out.scrollHeight; };

function typeIn(el) {
  if (REDUCED) return;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = w.nextNode())) if (n.data.length) { nodes.push([n, n.data]); n.data = ''; }
  if (!nodes.length) return;
  const job = { i: 0, c: 0, t: performance.now() };
  job.done = () => {
    for (; job.i < nodes.length; job.i++) nodes[job.i][0].data = nodes[job.i][1];
    typing.delete(job);
    if (!typing.size) out.removeAttribute('aria-busy');
  };
  typing.add(job); out.setAttribute('aria-busy', 'true');
  const step = () => {
    if (!typing.has(job)) return;
    const now = performance.now();
    let budget = Math.max(1, Math.round((now - job.t) * CPS / 1000)); job.t = now;
    while (budget > 0 && job.i < nodes.length) {
      const [nd, full] = nodes[job.i];
      const take = Math.min(budget, full.length - job.c);
      job.c += take; budget -= take; nd.data = full.slice(0, job.c);
      if (job.c >= full.length) { job.i++; job.c = 0; }
    }
    if (job.i >= nodes.length) job.done();
    else setTimeout(step, 16);
    scroll();
  };
  setTimeout(step, 16);

function run(raw) {
  flush();

  if (!line) return;
  if (hist[hist.length - 1] !== line) hist.push(line);
  hIdx = hist.length;
  const parts = line.split(/\s+/);
  const c0 = parts[0].toLowerCase();
  const c = ALIAS[c0] || c0;
  const fn = Object.prototype.hasOwnProperty.call(CMD, c) ? CMD[c] : null;
  if (fn) fn(parts.slice(1), c0);
  else print(`<span class="err">${esc(t('notFound'))}: ${esc(parts[0])}</span><br><span class="mut">${t('tryHelp')}</span>`);
}

/* ================= escritura automática (arranque y botones) ================= */
let autoTok = 0, autoBusy = false;
function autoType(cmd) {
  const tok = ++autoTok;
  autoBusy = true;
  return new Promise(r => {
    const res = v => { if (tok === autoTok) autoBusy = false; r(v); };
    if (REDUCED) return res(tok === autoTok);
    input.value = ''; let i = 0;
    const tick = () => {
      if (tok !== autoTok) return res(false);
      if (i < cmd.length) { input.value += cmd[i++]; setTimeout(tick, 22 + Math.random() * 28); }
      else setTimeout(() => res(tok === autoTok), 110);
    };
    tick();
  });
}
async function typeAndRun(cmd) {
  abortBoot();
  flush();
  const ok = await autoType(cmd);
  if (!ok) return;
  input.value = ''; run(cmd);
  if (FINE) input.focus({ preventScroll: true });
}

const bootQ = ['whoami', 'projects']; let booting = true;
function abortBoot() {
  if (!booting) return;
  booting = false; autoTok++; autoBusy = false; input.value = '';
  while (bootQ.length) run(bootQ.shift());
  flush();
}
async function boot() {
  const now = new Date();
  print(`<span class="mut">${t('lastLogin')}: ${esc(now.toLocaleDateString(lang === 'es' ? 'es-ES' : 'en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }))} ${pad(now.getHours())}:${pad(now.getMinutes())} on web</span><br><span class="mut">${t('banner')}</span>`);
  if (REDUCED) { abortBoot(); return; }
  await idle(); await sleep(350);
  while (booting && bootQ.length) {
    const c = bootQ[0];
    const ok = await autoType(c);
    if (!booting || !ok) break;
    input.value = ''; bootQ.shift(); run(c);
    await idle();
    if (!booting) break;
    await sleep(380);
  }
  booting = false;
}

/* ================= entrada de teclado ================= */
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  if (autoBusy && !booting) return; // un botón está escribiendo su comando: se ejecutará solo
  abortBoot();
  const v = input.value; input.value = ''; run(v);
});
function completeInput() {
  const v = input.value;
  let base, prefix, cands;
  const m1 = v.match(/^(\s*)(\S*)$/);
  if (m1) { base = m1[1]; prefix = m1[2].toLowerCase(); cands = COMPLETE; }
  else {
    const m2 = v.match(/^\s*(\S+)\s+(\S*)$/);
    if (!m2) return;
    const c = ALIAS[m2[1].toLowerCase()] || m2[1].toLowerCase();
    prefix = m2[2].toLowerCase(); base = v.slice(0, v.length - m2[2].length);
    cands = c === 'open' ? PID.concat('cv') : c === 'close' ? tabs.filter(x => x !== 'dash') : c === 'lang' ? ['en', 'es'] : c === 'cat' ? FILES : c === 'play' ? ['dive'] : c === 'ls' ? ['projects/', 'cv/'] : [];
  }
  const hits = cands.filter(x => x.startsWith(prefix));
  if (hits.length === 1) input.value = base + hits[0] + (m1 && !['help', 'whoami', 'experience', 'projects', 'stack', 'cv', 'contact', 'clear', 'classic', 'history'].includes(hits[0]) ? ' ' : '');
  else if (hits.length > 1) {
    let cp = hits[0];
    hits.forEach(h => { while (!h.startsWith(cp)) cp = cp.slice(0, -1); });
    if (cp.length > prefix.length) input.value = base + cp;
    else { echo(v); print(hits.map(h => `<span class="k">${esc(h)}</span>`).join('  ')); }
  }
}
input.addEventListener('keydown', e => {
  if (booting && !['Tab', 'Shift', 'Control', 'Alt', 'Meta'].includes(e.key)) abortBoot();
  if (autoBusy && e.key !== 'Enter' && e.key !== 'Tab' && !e.ctrlKey) { autoTok++; autoBusy = false; input.value = ''; }
  if (e.key === 'Tab' && !e.shiftKey && input.value.trim()) { e.preventDefault(); completeInput(); }
  else if (e.key === 'ArrowUp') {
    if (!hist.length) return; e.preventDefault();
    hIdx = Math.max(0, hIdx - 1); input.value = hist[hIdx];
    requestAnimationFrame(() => input.setSelectionRange(input.value.length, input.value.length));
  } else if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (hIdx < hist.length - 1) { hIdx++; input.value = hist[hIdx]; } else { hIdx = hist.length; input.value = ''; }
  } else if (e.ctrlKey && (e.key === 'l' || e.key === 'L')) { e.preventDefault(); CMD.clear(); }
  else if (e.ctrlKey && (e.key === 'c' || e.key === 'C') && input.selectionStart === input.selectionEnd) { e.preventDefault(); echo(input.value + '^C'); input.value = ''; flush(); }
  else if (e.key === 'Escape') { input.value = ''; }
});
// Teclados virtuales y dictado no siempre envían keydown: si el usuario escribe mientras se autoescribe, manda lo suyo
input.addEventListener('input', e => {
  if (!e.isTrusted || !(booting || autoBusy)) return;
  const typed = e.data || '';
  if (booting) abortBoot(); else { autoTok++; autoBusy = false; }
  input.value = typed;
});
// Escribir en cualquier sitio lleva a la terminal
document.addEventListener('keydown', e => {
  if (document.body.dataset.mode !== 'console') return;
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1) return;
  const tg = e.target;
  if (tg === input || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName) || tg.isContentEditable) return;
  if (tg.closest && tg.closest('button,a,[role=tab]') && (e.key === ' ' || e.key === 'Enter')) return;
  if (document.body.dataset.view === 'view' && isMobile()) return;
  input.focus();
});
out.addEventListener('click', e => {
  const b = e.target.closest('[data-run]');
  if (b) { typeAndRun(b.dataset.run); return; }
  if (e.target.closest('a,button')) return;
  const sel = getSelection();
  if (sel && !sel.isCollapsed) return;
  input.focus({ preventScroll: true });
});

const svgI = (d, lleno) => `<svg class="i${lleno ? ' lleno' : ''}" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICO = {

  mail: svgI('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>'),
  flecha: svgI('<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>').replace('class="i"', 'class="i flecha"'),
  linkedin: svgI('<path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>', true),
  github: svgI('<path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>', true),
};
function renderHome() {
  const h = HOME[lang];
  const card = it => {
    const p = byId(it.id);
    return `<article class="pc"><div class="badge ${it.badge ? 'on' : ''}">● ${esc(it.badge)}</div><h3>${esc(it.t)}</h3><p>${esc(it.d)}</p>
      ${it.cta && p.demo ? `<a class="bt" href="${esc(demoUrl(p))}" target="_blank" rel="noopener">${esc(it.cta)} ↗</a>` : ''}
      <details><summary>${esc(h.tech)}</summary><div class="tagl">${p.stack.map(s => `<span>${esc(s)}</span>`).join('')}</div></details></article>`;
  };
  $('#home').innerHTML = `<div class="wrap">
    <div class="eyebrow mono" aria-hidden="true">miguel@<i>valencia</i>:~$ whoami<span class="cursor"></span></div>
    <h1>${esc(h.hi)}</h1>
    <p class="lead">${esc(h.lead)}</p>
    <p class="sub">${esc(h.sub)}</p>
    <div class="cta">
      <a class="bt pri" href="${esc(lang === 'es' ? CV.pdfEs : CV.pdfEn)}" target="_blank" rel="noopener">${ICO.cv}${esc(h.cv)}${ICO.flecha}</a>
      <a class="bt mail" href="mailto:${EMAIL}">${ICO.mail}${esc(h.write)}</a>
      <a class="bt ic" href="${esc(LINKEDIN)}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">${ICO.linkedin}</a>
      <a class="bt ic" href="${esc(GITHUB)}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">${ICO.github}</a>
    </div>
    <div class="stats">${h.stats.map(([a, b]) => `<div class="stat"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>
    <h2>${esc(h.buildT)}</h2>
    <div class="grid">${h.items.map(card).join('')}</div>
    <p class="also">${esc(h.alsoA)} <a href="${esc(demoUrl(byId('dive')))}" target="_blank" rel="noopener">${esc(h.alsoL)}</a> ${esc(h.alsoB)}</p>
    <h2>${esc(h.pathT)}</h2>
    <ul class="path">${h.path.map(([w, r, o, d]) => `<li><span class="when">${esc(w)}</span><div><b>${esc(r)}</b> · <em>${esc(o)}</em><p>${esc(d)}</p></div></li>`).join('')}</ul>
    <section class="end"><h2>${esc(h.endT)}</h2><p>${esc(h.endD)}</p>
      <div class="cta"><a class="bt pri" href="mailto:${EMAIL}">${ICO.mail}${EMAIL}</a><a class="bt ic" href="${esc(LINKEDIN)}" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">${ICO.linkedin}</a><a class="bt ic" href="${esc(GITHUB)}" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">${ICO.github}</a></div></section>
    <p class="tech">${esc(h.techA)} <button type="button" data-console>${esc(h.techB)}</button> ${esc(h.techC)}</p>
  </div>`;
  $('#modeBtn').textContent = document.body.dataset.mode === 'console' ? h.modeH : h.modeC;
}
function initialMode() {
  const q = new URLSearchParams(location.search).get('view');
  if (q === 'console' || q === 'home') return q;
  try { if (localStorage.getItem('mp-mode') === 'console') return 'console'; } catch (e) { /* sin almacenamiento */ }
  return 'home';
}
function setMode(m, elegido = true) {
  document.body.dataset.mode = m;
  $('#modeBtn').textContent = m === 'console' ? HOME[lang].modeH : HOME[lang].modeC;
  if (elegido) { try { localStorage.setItem('mp-mode', m); } catch (e) { /* sin almacenamiento */ } }
  if (m !== 'console') return;
  if (!bootStarted) { bootStarted = true; boot(); }
  if (FINE) input.focus({ preventScroll: true });
}
$('#modeBtn').addEventListener('click', () => setMode(document.body.dataset.mode === 'console' ? 'home' : 'console'));
$('#home').addEventListener('click', e => { if (e.target.closest('[data-console]')) setMode('console'); });

/* ================= idioma ================= */
function setLang(l, elegido = true) {
  lang = l;
  document.documentElement.lang = l;
  if (elegido) {
    try { localStorage.setItem('mp-lang', l); } catch (e) { /* sin almacenamiento */ }
    try { const u = new URL(location.href); u.searchParams.set('lang', l); history.replaceState(null, '', u); } catch (e) { /* file:// u otros */ }
  }
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.langsw [data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
  $('#out').setAttribute('aria-label', l === 'es' ? 'Salida de la terminal' : 'Terminal output');
  $('#chips').setAttribute('aria-label', l === 'es' ? 'Comandos' : 'Commands');
  $('.langsw').setAttribute('aria-label', l === 'es' ? 'Idioma' : 'Language');
  $('.status').setAttribute('aria-label', l === 'es' ? 'Barra de estado' : 'Status bar');
  $('.mswitch').setAttribute('aria-label', l === 'es' ? 'Paneles' : 'Panels');
  renderChips();
  renderHome();
  for (const id of panes.keys()) renderPane(id);
  renderTabs();
}
document.querySelectorAll('.langsw [data-lang]').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  if (!bootStarted) { setLang(b.dataset.lang); return; }
  abortBoot(); run('lang ' + b.dataset.lang);
}));

/* ================= reloj y uptime ================= */
const t0 = Date.now();
function tick() {
  const d = new Date();
  $('#clock').textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  $('#clock').setAttribute('datetime', d.toISOString());
  const s = Math.floor((Date.now() - t0) / 1000);
  $('#uptime').textContent = `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`;
}
setInterval(tick, 1000); tick();
$('#pcount').textContent = PROJECTS.length;

/* ================= arranque ================= */
const dash = document.createElement('div');
dash.className = 'vp'; dash.id = 'vp-dash'; dash.setAttribute('role', 'tabpanel');
viewEl.appendChild(dash); panes.set('dash', dash);
setLang(initialLang(), false);
setMode(initialMode(), false);
})();
</script>
</body>
</html>
